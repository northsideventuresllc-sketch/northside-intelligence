<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
    <radialGradient id="gs-radar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF3B30" stop-opacity="0" />
    </radialGradient>
    <filter id="gs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer HUD Ring -->
  <circle cx="60" cy="60" r="50" stroke="url(#gs-grad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4" />
  
  <!-- Radar Sweep Cone -->
  <path d="M60 60 L95 25 A50 50 0 0 1 110 60 Z" fill="url(#gs-radar)" />

  <!-- Core Target Grid -->
  <circle cx="60" cy="60" r="36" stroke="url(#gs-grad)" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="60" cy="60" r="20" stroke="url(#gs-grad)" stroke-width="2" />
  <circle cx="60" cy="60" r="4" fill="#FF3B30" filter="url(#gs-glow)" />

  <!-- Crosshairs -->
  <line x1="60" y1="12" x2="60" y2="30" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="90" x2="60" y2="108" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round" />
  <line x1="12" y1="60" x2="30" y2="60" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round" />
  <line x1="90" y1="60" x2="108" y2="60" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round" />

  <!-- Vulnerability Detection Blips -->
  <circle cx="82" cy="40" r="3" fill="#FF9500" filter="url(#gs-glow)" />
  <circle cx="42" cy="76" r="2.5" fill="#FF3B30" filter="url(#gs-glow)" />
</svg>
