<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="sig-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="sig-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Broadcast Radar Arcs -->
  <path d="M 34 34 A 40 40 0 0 1 86 34" stroke="url(#sig-grad)" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" stroke-dasharray="4 6" />
  <path d="M 42 44 A 28 28 0 0 1 78 44" stroke="url(#sig-grad)" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round" />
  <path d="M 50 54 A 16 16 0 0 1 70 54" stroke="url(#sig-grad)" stroke-width="3" stroke-linecap="round" filter="url(#sig-glow)" />

  <!-- Central Transmitter Origin -->
  <circle cx="60" cy="62" r="5" fill="#10B981" filter="url(#sig-glow)" />
  <circle cx="60" cy="62" r="2.5" fill="#FFFFFF" />

  <!-- Real-Time Telemetry Frequency Waves -->
  <path d="M 22 92 L 36 92 L 44 76 L 54 104 L 64 68 L 74 98 L 84 86 L 98 86" stroke="url(#sig-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#sig-glow)" />

  <!-- Base Grid Platform -->
  <line x1="20" y1="106" x2="100" y2="106" stroke="url(#sig-grad)" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round" />
</svg>
