<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bridge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <filter id="bridge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Orbitals -->
  <ellipse cx="60" cy="60" rx="48" ry="24" stroke="url(#bridge-grad)" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(-25 60 60)" />
  <ellipse cx="60" cy="60" rx="48" ry="24" stroke="url(#bridge-grad)" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(25 60 60)" />

  <!-- Quantum Synapse Bridge Arc -->
  <path d="M 28 60 C 42 35, 78 35, 92 60" stroke="url(#bridge-grad)" stroke-width="4" stroke-linecap="round" filter="url(#bridge-glow)" />
  <path d="M 28 60 C 42 85, 78 85, 92 60" stroke="url(#bridge-grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />

  <!-- Neural Nodes -->
  <circle cx="28" cy="60" r="8" fill="#8A2BE2" filter="url(#bridge-glow)" />
  <circle cx="28" cy="60" r="4" fill="#FFFFFF" />
  
  <circle cx="92" cy="60" r="8" fill="#00F5D4" filter="url(#bridge-glow)" />
  <circle cx="92" cy="60" r="4" fill="#FFFFFF" />

  <!-- Central Nexus Core -->
  <circle cx="60" cy="60" r="10" fill="#3B82F6" filter="url(#bridge-glow)" />
  <circle cx="60" cy="60" r="5" fill="#FFFFFF" />
</svg>
